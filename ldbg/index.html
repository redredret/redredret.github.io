	--gold-deep: #b98c4c;

	padding: 0;
	border: 0;
}

body {
	color: var(--ink);
	background-color: var(--night);
	overflow: hidden;
	touch-action: none;
}

}

#canvas:focus {
	outline: none;

	transition: opacity 420ms ease;
	z-index: 10;
}

#status.leaving {
	opacity: 0;
	pointer-events: none;
}

#stage {
	position: relative;
	width: 0;
	height: 0;

	top: calc(var(--icon) * -0.1 - 24px);

#logo {

	top: calc(var(--logo-w) * -0.159);

	position: absolute;

	left: calc(var(--logo-w) * -0.25);
	top: calc(var(--logo-w) * -0.25);

	border: 3px solid var(--gold);
	opacity: 0;
	z-index: 1;
	animation: shockwave 700ms ease-out 480ms both;
}

.burst {
	position: absolute;
	width: var(--icon);
	height: var(--icon);
	left: calc(var(--icon) / -2);
	top: calc(var(--icon) / -2);
	z-index: 1;
	animation: burst 760ms cubic-bezier(0.22, 1.5, 0.5, 1) both;
	animation-delay: calc(520ms + var(--i) * 70ms);

.burst img {
	display: block;
	width: 100%;
	height: 100%;
	filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
	animation: bob 2.6s ease-in-out infinite;
	animation-delay: calc(1300ms + var(--i) * 260ms);
}

#loader {
	position: absolute;
	width: min(60vw, 280px);
	left: calc(min(60vw, 280px) / -2);
	top: calc(var(--ry) + var(--icon) * 0.7 + 28px);

#status-progress {

	height: 6px;
	border-radius: 3px;
	background: rgba(244, 241, 232, 0.12);

	width: 35%;

#status-label {

	font-weight: 700;
	letter-spacing: 0.24em;

	position: absolute;

}

@keyframes fade-in {

	}

// assets/ui/wordmark/ldbg_icon.svg). Once the game has drawn the player's head
// (src/main/favicon_portrait.gd) it is kept, and a returning player's head is
// put back here before the engine loads.
//
// The engine sets its own copy of the project icon as it starts, which would
// cover the saved head for the few seconds until the game redraws it, so the
// saved head is held against that until the game sets LDBGFaviconDrawn.
(function () {
	try {
		const saved = window.localStorage.getItem('ldbg.favicon');
		if (!saved || saved.indexOf('data:image/png;base64,') !== 0) {
			return;
		}
		const hold = function () {
			if (window.LDBGFaviconDrawn) {
				return;

// F11 goes fullscreen, and F11 again comes back (src/core/fullscreen_hotkey.gd

	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Something went wrong while loading. Reload the page to try again.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'This browser can\'t run the game. It is missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// The patch, when the deploy names one: fetched beside the base, checked
		// here, and in the engine's file system before main() runs, where
		// PatchMount, the first autoload, checks it again and mounts it. One that
		// will not download or names another base is never handed over: the whole
		// build is loaded over the base's file instead (copyToFS writes the
		// preloaded files in order, so the later one wins). startGame starts the
		// engine through engine.start, so holding that holds only the start.
		let patchBytes = { loaded: 0, total: 0 };
		if (patchName) {
			patchBytes.total = (GODOT_CONFIG['fileSizes'] || {})[patchName] || 0;
			const fetchPatch = function (attempt) {
				patchBytes.loaded = 0;
				return fetch(patchName).then(function (response) {
					if (!response.ok) {
						throw new Error('the patch did not download (' + response.status + ')');
					}
					const reader = response.body.getReader();
					const parts = [];
					const pump = function () {
						return reader.read().then(function (chunk) {
							if (chunk.done) {
								return new Blob(parts).arrayBuffer();
							}
							parts.push(chunk.value);
							patchBytes.loaded += chunk.value.length;
							return pump();
						});
					};
					return pump();
				}).catch(function (err) {
					if (attempt >= 4) {
						throw err;
					}
					return new Promise(function (resolve) {
						setTimeout(resolve, 1000);
					}).then(function () {
						return fetchPatch(attempt + 1);
					});
				});
			};
			const patchChecked = fetchPatch(1).then(function (buffer) {
				const madeFor = patchMadeFor(buffer);
				if (madeFor !== patchBase) {
					throw new Error(madeFor === null ? 'the patch is not a whole pack' : 'the patch is for base "' + madeFor + '"');
				}
				return buffer;
			}).catch(function (err) {
				console.warn('[patch] ' + err.message + '; loading the full build');
				return null;
			});
			const start = engine.start;
			engine.start = function (override) {
				return patchChecked.then(function (buffer) {
					if (buffer) {
						return engine.preloadFile(buffer, 'ldbg_patch.pck');
					}
					patchName = '';
					statusProgress.classList.add('indeterminate');
					return engine.preloadFile(fullPack, GODOT_CONFIG['mainPack']);
				}).then(function () {
					return start.call(engine, override);
				});
			};
		}
		engine.startGame({
			'mainPack': fullPackAsked ? fullPack : GODOT_CONFIG['mainPack'],
			'onProgress': function (current, total) {
				if (patchName && current > 0 && total > 0) {
					current += patchBytes.loaded;
					total += patchBytes.total;
				}
				if (current > 0 && total > 0) {
					showProgress('download', current / total);
					if (current >= total && bootPhase === 'download') {
						// Everything is in: what follows is the engine starting on
						// this thread, the stretch a watchdog must not lose.
						bootPhase = 'engine';
					}
				} else {
					statusProgress.classList.add('indeterminate');
					statusFill.style.transform = '';
				}
			},
		}).then(() => {
			engineStarted = true;
			engineStartedAt = Date.now();
			lastWordAt = engineStartedAt;
			if (bootPhase === 'download') {
				bootPhase = 'engine';
			}
			if (!gameReady) {
				showProgress(bootPhase, bootFraction);
			}
			const fallback = setInterval(function () {
				const now = Date.now();
				if (!initializing) {
					clearInterval(fallback);
				} else if (now - lastWordAt >= READY_TIMEOUT_MS || now - engineStartedAt >= READY_LIMIT_MS) {
					clearInterval(fallback);
					reveal();
				}
			}, 1000);
			maybeReveal();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
