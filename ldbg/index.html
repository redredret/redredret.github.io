		<!--
		LDBG's browser shell: Godot's default web shell with its loading overlay
		replaced by the game's own -- the wordmark, with the five main-menu icons
		bursting out of it. Set as html/custom_html_shell in export_presets.cfg.
		The art lives in web/loading/ (tools/build_loading_screen_art.py) and is
		copied beside the export by tools/export_web.ps1.

		The overlay stays up after the engine has started, until the game says its
		first screen is ready (window.LDBGLoading.done(), called by Main), so the
		boot splash and the frames spent building the hub are never seen.
		-->
		<style>
:root {
	--ink: #f4f1e8;
	--muted: #9aa5a3;
	--gold: #e6c888;
	--gold-deep: #b98c4c;
	--night: #0b1316;
	--slate: #182226;
	--logo-w: min(50vw, 440px);
	--icon: clamp(44px, calc(var(--logo-w) * 0.23), 100px);
	--rx: calc(var(--logo-w) * 0.78);
	--ry: calc(var(--logo-w) * 0.42);
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--ink);
	background-color: var(--night);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background:
		radial-gradient(ellipse at 50% 46%, rgba(230, 200, 136, 0.10), transparent 55%),
		radial-gradient(ellipse at 50% 50%, var(--slate), var(--night) 75%);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	visibility: hidden;
	transition: opacity 420ms ease;
	z-index: 10;
}

#status.leaving {
	opacity: 0;
	pointer-events: none;
}

/* The logo sits at the centre of a zero-size stage; everything else is placed
   around that point. */
#stage {
	position: relative;
	width: 0;
	height: 0;
	/* Up by half the loader's height, so the whole group -- top icon to loading
	   bar -- is what sits in the middle of the screen. */
	top: calc(var(--icon) * -0.1 - 24px);
}

#logo {
	position: absolute;
	width: var(--logo-w);
	left: calc(var(--logo-w) / -2);
	top: calc(var(--logo-w) * -0.159);
	z-index: 2;
	animation: logo-in 620ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
	filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
}

#shockwave {
	position: absolute;
	width: calc(var(--logo-w) * 0.5);
	height: calc(var(--logo-w) * 0.5);
	left: calc(var(--logo-w) * -0.25);
	top: calc(var(--logo-w) * -0.25);
	border-radius: 50%;
	border: 3px solid var(--gold);
	opacity: 0;
	z-index: 1;
	animation: shockwave 700ms ease-out 480ms both;
}

.burst {
	position: absolute;
	width: var(--icon);
	height: var(--icon);
	left: calc(var(--icon) / -2);
	top: calc(var(--icon) / -2);
	z-index: 1;
	animation: burst 760ms cubic-bezier(0.22, 1.5, 0.5, 1) both;
	animation-delay: calc(520ms + var(--i) * 70ms);
}

.burst img {
	display: block;
	width: 100%;
	height: 100%;
	filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
	animation: bob 2.6s ease-in-out infinite;
	animation-delay: calc(1300ms + var(--i) * 260ms);
}

#loader {
	position: absolute;
	width: min(60vw, 280px);
	left: calc(min(60vw, 280px) / -2);
	top: calc(var(--ry) + var(--icon) * 0.7 + 28px);
	text-align: center;
	animation: fade-in 500ms ease 900ms both;
}

#status-progress {
	position: relative;
	height: 6px;
	border-radius: 3px;
	background: rgba(244, 241, 232, 0.12);
	overflow: hidden;
}

/* Filled by transform rather than width, so the bar moves on the compositor and
   costs the page's thread nothing while the game is starting. */
#status-progress-fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 100%;
	border-radius: 3px;
	background: linear-gradient(90deg, var(--gold-deep), var(--gold));
	transform: scaleX(0);
	transform-origin: left center;
	transition: transform 200ms ease;
}

#status-progress.indeterminate #status-progress-fill {
	width: 35%;
	transform: none;
	animation: sweep 1.2s ease-in-out infinite;
}

#status-label {
	margin-top: 10px;
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 0.24em;
	color: var(--muted);
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	bottom: 8%;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 1rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 3;
}

@keyframes logo-in {
	0% { transform: scale(0.4); opacity: 0; }
	60% { opacity: 1; }
	100% { transform: scale(1); opacity: 1; }
}

@keyframes shockwave {
	0% { transform: scale(0.3); opacity: 0.9; }
	100% { transform: scale(3.2); opacity: 0; }
}

@keyframes burst {
	0% {
		transform: translate(0, 0) scale(0.2) rotate(calc(var(--spin) * 3));
		opacity: 0;
	}
	25% { opacity: 1; }
	100% {
		transform: translate(calc(var(--x) * var(--rx)), calc(var(--y) * var(--ry))) scale(1) rotate(var(--spin));
		opacity: 1;
	}
}

@keyframes bob {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-6px); }
}

@keyframes fade-in {
	from { opacity: 0; }
	to { opacity: 1; }
}

@keyframes sweep {
	0% { transform: translateX(-100%); }
	100% { transform: translateX(290%); }
}

@media (prefers-reduced-motion: reduce) {
	#logo, .burst, .burst img, #shockwave, #loader {
		animation-duration: 1ms !important;
		animation-delay: 0ms !important;
		animation-iteration-count: 1 !important;
	}
}

// Before anything is drawn the tab shows the project icon (LD over BG, from
// assets/ui/wordmark/ldbg_icon.svg). Once the game has drawn the player's head
// (src/main/favicon_portrait.gd) it is kept, and a returning player's head is
// put back here before the engine loads.
//
// The engine sets its own copy of the project icon as it starts, which would
// cover the saved head for the few seconds until the game redraws it, so the
// saved head is held against that until the game sets LDBGFaviconDrawn.
(function () {
	try {
		const saved = window.localStorage.getItem('ldbg.favicon');
		if (!saved || saved.indexOf('data:image/png;base64,') !== 0) {
			return;
		}
		const hold = function () {
			if (window.LDBGFaviconDrawn) {
				return;
			}
			document.querySelectorAll("link[rel~='icon']").forEach(function (link) {
				if (link.href !== saved) {
					link.href = saved;
				}
			});
		};
		document.addEventListener('DOMContentLoaded', function () {
			hold();
			new MutationObserver(hold).observe(document.head, {
				subtree: true, childList: true, attributes: true, attributeFilter: ['href'],
			});
		});
	} catch (err) {
		// Storage can be blocked; the default icon stands.
	}
}());

// F11 goes fullscreen, and F11 again comes back (src/core/fullscreen_hotkey.gd
// does the same in a native build). The engine's canvas takes every key and
// cancels the browser's own handling, so the browser's F11 never happens.
//
// Done HERE, inside the key press, rather than by the engine: a browser only
// allows fullscreen while the user is still "activating" the page, and the
// engine reads keys on its next frame -- which a hidden or throttled tab may
// not have for seconds, by when Chrome refuses ("Permissions check failed",
// measured 2026-09-30). The listener runs before the canvas's, and stops the
// key there, so the engine never toggles a second time.
//
// The desktop client takes F11 before the page ever sees it (desktop/main.js),
// so in the client this never runs.
window.addEventListener('keydown', function (event) {
	if (event.key !== 'F11' && event.code !== 'F11') {
		return;
	}
	event.preventDefault();
	event.stopImmediatePropagation();
	if (event.repeat) {
		return;
	}
	if (document.fullscreenElement) {
		document.exitFullscreen().catch(function () {});
		return;
	}
	const target = document.getElementById('canvas') || document.documentElement;
	if (target.requestFullscreen) {
		target.requestFullscreen().catch(function () {});
	}
}, true);

// The loading screen's sound: loading/intro.wav, one clip scored to the
// animation below (art/audio/sfx_briefs.json, loading_intro): a bloom as the
// wordmark pops in, a soft whump as the gold ring leaves it at 480 ms, and a
// plink for each icon as it bursts out, 520 to 800 ms. The clip's zero is the
// logo animation's zero, so it is played at wherever that animation has got to.
//
// A browser lets a page make sound before its first click only sometimes (a
// site the player keeps coming back to, the desktop client). Where it does
// not, the audio context stays suspended and this stays silent: the animation
// is over long before any click could come, and the sound never plays late.
//
// The game mirrors its Master x SFX volume, 0 when muted, into
// localStorage 'ldbg.soundVolume' (src/core/volume_settings.gd), so a player
// who turned the game down or muted it is not greeted at full volume.
(function () {
	// The clip is levelled at the house -18 LUFS; this plays it at -23.9, where
	// the review put it (a little over the menu click, as heard in game).
	const LEVEL_DB = -5.9;
	// Past this far into the animation there is too little left to join.
	const LATE_LIMIT_S = 0.7;
	let volume = 1;
	try {
		const saved = window.localStorage.getItem('ldbg.soundVolume');
		if (saved !== null && isFinite(parseFloat(saved))) {
			volume = Math.min(1, Math.max(0, parseFloat(saved)));
		}
	} catch (err) {
		// Storage can be blocked; the default volume stands.
	}
	const Context = window.AudioContext || window.webkitAudioContext;
	if (!(volume > 0) || !Context || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
		return;
	}
	let ctx;
	try {
		ctx = new Context();
	} catch (err) {
		return;
	}
	const done = function () {
		ctx.close().catch(function () {});
	};
	// Pending forever where sound is not allowed yet; the state is read instead.
	if (ctx.state !== 'running') {
		ctx.resume().catch(function () {});
	}
	const clip = fetch('loading/intro.wav')
		.then(function (response) { return response.ok ? response.arrayBuffer() : Promise.reject(response.status); })
		.then(function (bytes) { return ctx.decodeAudioData(bytes); });
	document.addEventListener('DOMContentLoaded', function () {
		const logo = document.getElementById('logo');
		const animation = logo && logo.getAnimations ? logo.getAnimations()[0] : null;
		if (!animation) {
			done();
			return;
		}
		Promise.all([clip, animation.ready]).then(function (results) {
			const buffer = results[0];
			const play = function () {
				// Where in the clip the ear should be when this starts: the
				// animation's time, plus the time the sound takes to reach it.
				const at = (animation.currentTime || 0) / 1000 + (ctx.outputLatency || 0);
				if (at > LATE_LIMIT_S) {
					done();
					return;
				}
				const source = ctx.createBufferSource();
				const gain = ctx.createGain();
				source.buffer = buffer;
				source.connect(gain).connect(ctx.destination);
				const level = volume * Math.pow(10, LEVEL_DB / 20);
				const now = ctx.currentTime;
				if (at > 0.02) {
					// Joined partway: a short fade, so the cut is not a click.
					gain.gain.setValueAtTime(0, now);
					gain.gain.linearRampToValueAtTime(level, now + 0.015);
				} else {
					gain.gain.value = level;
				}
				source.onended = done;
				source.start(now + Math.max(0, -at), Math.max(0, at));
			};
			if (ctx.state === 'running') {
				play();
				return;
			}
			// Allowed a moment later (some browsers resume asynchronously), or
			// never: either way, gone once the animation is past joining.
			ctx.onstatechange = function () {
				if (ctx.state === 'running') {
					ctx.onstatechange = null;
					play();
				}
			};
			setTimeout(function () {
				if (ctx.state !== 'running') {
					done();
				}
			}, LATE_LIMIT_S * 1000);
		}).catch(done);
	});
}());

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-progress-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');
	const loader = document.getElementById('loader');

	// How long the overlay waits, once the engine is running, for the game to
	// say anything more (progress or done). Only a safety net: a build that never
	// calls done() still uncovers itself. Counted from the last word, because a
	// cold browser's warm-up legitimately takes longer than this in all.
	const READY_TIMEOUT_MS = 20000;
	// And the longest it waits in all, however much progress it hears.
	const READY_LIMIT_MS = 120000;

	let initializing = true;
	let statusMode = '';
	let engineStarted = false;
	let gameReady = false;
	let lastWordAt = 0;
	let engineStartedAt = 0;

	// Where the boot has got to, for the bar and for the freeze watchdog
	// (docs/CLIENT_PROBLEMS.md, "The boot"): 'download' while the engine and the
	// game are fetched, 'engine' from the moment they are in until the game
	// speaks, then whatever the game reports (src/main/boot_progress.gd).
	let bootPhase = 'download';
	let bootFraction = 0;
	// The bar, one sweep for the whole boot: the download fills its first half,
	// the game's own phases the rest.
	const PHASE_SPAN = {
		download: [0, 0.5],
		engine: [0.5, 0.55],
		loading: [0.55, 0.75],
		building: [0.75, 0.78],
		warming: [0.78, 1],
		ready: [1, 1],
	};
	const PHASE_LABEL = {
		download: 'LOADING',
		engine: 'STARTING',
		loading: 'STARTING',
		building: 'STARTING',
		warming: 'PREPARING',
		ready: 'READY',
	};

	function showProgress(phase, fraction) {
		const span = PHASE_SPAN[phase] || PHASE_SPAN.engine;
		const at = span[0] + (span[1] - span[0]) * Math.min(1, Math.max(0, fraction));
		statusProgress.classList.remove('indeterminate');
		statusFill.style.transform = 'scaleX(' + at.toFixed(3) + ')';
		statusLabel.textContent = PHASE_LABEL[phase] || 'STARTING';
	}

	// from the first moment, so a boot that holds the thread is caught too. A
	// timer is the honest witness: it fires only when the thread is free.

		const bridge = window.LDBGSpacetime;
		if (bridge && typeof bridge.diagnosticsBootBeat === 'function') {
			try {

			setStatusNotice(err.message);

			setStatusNotice(err);

		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					showProgress('download', current / total);
					if (current >= total && bootPhase === 'download') {

						// this thread, the stretch a watchdog must not lose.
						bootPhase = 'engine';

					statusProgress.classList.add('indeterminate');
					statusFill.style.transform = '';

			engineStarted = true;
			engineStartedAt = Date.now();
			lastWordAt = engineStartedAt;
			if (bootPhase === 'download') {
				bootPhase = 'engine';

			if (!gameReady) {

				const now = Date.now();

					clearInterval(fallback);
				} else if (now - lastWordAt >= READY_TIMEOUT_MS || now - engineStartedAt >= READY_LIMIT_MS) {
					clearInterval(fallback);
					reveal();
				}
			}, 1000);
