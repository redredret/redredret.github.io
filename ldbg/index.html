		<!--
		LDBG's browser shell: Godot's default web shell with its loading overlay
		replaced by the game's own -- the wordmark, with the five main-menu icons
		bursting out of it. Set as html/custom_html_shell in export_presets.cfg.
		The art lives in web/loading/ (tools/build_loading_screen_art.py) and is
		copied beside the export by tools/export_web.ps1.

		The overlay stays up after the engine has started, until the game says its
		first screen is ready (window.LDBGLoading.done(), called by Main), so the
		boot splash and the frames spent building the hub are never seen.
		-->
		<style>
:root {
	--ink: #f4f1e8;
	--muted: #9aa5a3;
	--gold: #e6c888;
	--gold-deep: #b98c4c;
	--night: #0b1316;
	--slate: #182226;
	--logo-w: min(50vw, 440px);
	--icon: clamp(44px, calc(var(--logo-w) * 0.23), 100px);
	--rx: calc(var(--logo-w) * 0.78);
	--ry: calc(var(--logo-w) * 0.42);
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--ink);
	background-color: var(--night);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background:
		radial-gradient(ellipse at 50% 46%, rgba(230, 200, 136, 0.10), transparent 55%),
		radial-gradient(ellipse at 50% 50%, var(--slate), var(--night) 75%);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	visibility: hidden;
	transition: opacity 420ms ease;
	z-index: 10;
}

#status.leaving {
	opacity: 0;
	pointer-events: none;
}

/* The logo sits at the centre of a zero-size stage; everything else is placed
   around that point. */
#stage {
	position: relative;
	width: 0;
	height: 0;
	/* Up by half the loader's height, so the whole group -- top icon to loading
	   bar -- is what sits in the middle of the screen. */
	top: calc(var(--icon) * -0.1 - 24px);
}

#logo {
	position: absolute;
	width: var(--logo-w);
	left: calc(var(--logo-w) / -2);
	top: calc(var(--logo-w) * -0.159);
	z-index: 2;
	animation: logo-in 620ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
	filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
}

#shockwave {
	position: absolute;
	width: calc(var(--logo-w) * 0.5);
	height: calc(var(--logo-w) * 0.5);
	left: calc(var(--logo-w) * -0.25);
	top: calc(var(--logo-w) * -0.25);
	border-radius: 50%;
	border: 3px solid var(--gold);
	opacity: 0;
	z-index: 1;
	animation: shockwave 700ms ease-out 480ms both;
}

.burst {
	position: absolute;
	width: var(--icon);
	height: var(--icon);
	left: calc(var(--icon) / -2);
	top: calc(var(--icon) / -2);
	z-index: 1;
	animation: burst 760ms cubic-bezier(0.22, 1.5, 0.5, 1) both;
	animation-delay: calc(520ms + var(--i) * 70ms);
}

.burst img {
	display: block;
	width: 100%;
	height: 100%;
	filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
	animation: bob 2.6s ease-in-out infinite;
	animation-delay: calc(1300ms + var(--i) * 260ms);
}

#loader {
	position: absolute;
	width: min(60vw, 280px);
	left: calc(min(60vw, 280px) / -2);
	top: calc(var(--ry) + var(--icon) * 0.7 + 28px);
	text-align: center;
	animation: fade-in 500ms ease 900ms both;
}

#status-progress {
	position: relative;
	height: 6px;
	border-radius: 3px;
	background: rgba(244, 241, 232, 0.12);
	overflow: hidden;
}

#status-progress-fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 0;
	border-radius: 3px;
	background: linear-gradient(90deg, var(--gold-deep), var(--gold));
	transition: width 200ms ease;
}

#status-progress.indeterminate #status-progress-fill {
	width: 35%;
	animation: sweep 1.2s ease-in-out infinite;
}

#status-label {
	margin-top: 10px;
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 0.24em;
	color: var(--muted);
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	bottom: 8%;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 1rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 3;
}

@keyframes logo-in {
	0% { transform: scale(0.4); opacity: 0; }
	60% { opacity: 1; }
	100% { transform: scale(1); opacity: 1; }
}

@keyframes shockwave {
	0% { transform: scale(0.3); opacity: 0.9; }
	100% { transform: scale(3.2); opacity: 0; }
}

@keyframes burst {
	0% {
		transform: translate(0, 0) scale(0.2) rotate(calc(var(--spin) * 3));
		opacity: 0;
	}
	25% { opacity: 1; }
	100% {
		transform: translate(calc(var(--x) * var(--rx)), calc(var(--y) * var(--ry))) scale(1) rotate(var(--spin));
		opacity: 1;
	}
}

@keyframes bob {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-6px); }
}

@keyframes fade-in {
	from { opacity: 0; }
	to { opacity: 1; }
}

@keyframes sweep {
	0% { transform: translateX(-100%); }
	100% { transform: translateX(290%); }
}

@media (prefers-reduced-motion: reduce) {
	#logo, .burst, .burst img, #shockwave, #loader {
		animation-duration: 1ms !important;
		animation-delay: 0ms !important;
		animation-iteration-count: 1 !important;
	}
}

		<script>
// Before anything is drawn the tab shows the project icon (LD over BG, from
// assets/ui/wordmark/ldbg_icon.svg). Once the game has drawn the player's head
// (src/main/favicon_portrait.gd) it is kept, and a returning player's head is
// put back here before the engine loads.
//
// The engine sets its own copy of the project icon as it starts, which would
// cover the saved head for the few seconds until the game redraws it, so the
// saved head is held against that until the game sets LDBGFaviconDrawn.
(function () {
	try {
		const saved = window.localStorage.getItem('ldbg.favicon');
		if (!saved || saved.indexOf('data:image/png;base64,') !== 0) {
			return;
		}
		const hold = function () {
			if (window.LDBGFaviconDrawn) {
				return;
			}
			document.querySelectorAll("link[rel~='icon']").forEach(function (link) {
				if (link.href !== saved) {
					link.href = saved;
				}
			});
		};
		document.addEventListener('DOMContentLoaded', function () {
			hold();
			new MutationObserver(hold).observe(document.head, {
				subtree: true, childList: true, attributes: true, attributeFilter: ['href'],
			});
		});
	} catch (err) {
		// Storage can be blocked; the default icon stands.
	}
}());

	const statusFill = document.getElementById('status-progress-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');

	const READY_TIMEOUT_MS = 20000;

	let statusMode = '';
	let engineStarted = false;
	let gameReady = false;

	function reveal() {
